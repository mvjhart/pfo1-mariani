<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" 
        content="Primer Practica Profesional Obligatoria de Frontend. 
        Solo HTML y CSS.">
    <meta name="robots" content="noindex">

    <title>Contacto | PFO1 - Maria Victoria Mariani</title>

    <link rel="stylesheet" href="css/estilos.css">

    <!-- ################## Google Font: Inter ######################## -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- ############################################################## -->
     
</head>
<body>
    <header class="header">
        <nav>
            <ul>
                <li><a href="index.html">Presentación</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
                <li><a href="bonus.html">Bonus</a></li>
            </ul>
        </nav>

    </header>
    <main class="contacto">

        <h1>Contacto</h1>

        <p>
            ¿Construimos algo juntos?
            Contame un poco sobre vos y tus metas.
        </p>

        <form class="formulario">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresá tu nombre"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ingresá tu mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="5"
                    required
                ></textarea>
            </div>

            <button type="submit">
                Enviar mensaje
            </button>

        </form>

    </main>
    <footer class="footer">
        <section class="habilidades">
            <h2>Habilidades</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>PHP</li>
                <li>JavaScript</li>
                <li>TypeScript</li>
                <li>C#</li>
                <li>SQL</li>
            </ul>
        </section>
        <div class="info">
            <p>María Victoria Mariani</p>
            <div>
                <a href="https://ifts29-portada.vercel.app/trayecto/pfo1/" 
                    target="_blank"
                    rel="noopener"
                    title="Ir a la consigna del PFO"
                    >
                    PFO1 - Frontend
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
